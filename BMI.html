<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Percabangan</title>
</head>
<body>
    <label>Masukan Berat Badan:</label>
    <input type="number" id="inputBB"><br>
    <label>Masukan Tinggi Badan:</label>
    <input type="number" id="inputTB"><br>
    <button onclick="cekBMI()">CekBMI</button>
    <p id="hasil"></p>

    <script>
        function cekBMI(){
            const BB = Number(document.getElementById("inputBB").value);
            const TB = Number(document.getElementById("inputTB").value);
            let bmi = (BB / (TB * TB));

            let predikat;
            if(bmi < 18.5){
                predikat = "Kurus";
            }else if(bmi <= 24.9){
                predikat = "Normal";
            }else if(bmi <= 50){
                predikat = "Gemuk";
            }else{
                predikat = "Obesitas";
            }
            document.getElementById('hasil').textContent = predikat+" dengan BMI: "+bmi.toFixed(2);
         
        }
    </script>
</body>
</html>
